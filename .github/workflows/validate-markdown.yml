name: Validate markdown
permissions:
  contents: read

on:
  pull_request:
    branches-ignore:
      - gh-pages

jobs:
  markdown-lint:
    name: Lint markdown files
    runs-on: ubuntu-latest
    # Checks markdown syntax and formatting
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        continue-on-error: false
        id: markdown-lint
        with:
          globs: |
            **/*.md
            !.github/**/*.md
          config: '.markdownlint.jsonc'
      - name: Report markdown lint results
        if: steps.markdown-lint.outcome == 'failure'
        run: |
          echo "::warning::Markdown formatting issues found. Please review the linting results above and consider fixing formatting inconsistencies for better readability."

  markdown-link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    # check out the latest version of the code
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'

    - name: Install markdown-link-check
      run: npm install -g markdown-link-check

    # Checks the status of hyperlinks in .md files in verbose mode. Runs the
    # markdown-link-check CLI directly instead of through
    # tcort/github-action-markdown-link-check, which builds a Docker image on
    # every run and is prone to Docker Hub pull timeouts on GitHub-hosted
    # runners.
    - name: Check links
      continue-on-error: true
      id: link-check
      run: |
        set +e
        status=0
        while IFS= read -r -d '' file; do
          echo "Checking $file"
          markdown-link-check --quiet --verbose "$file"
          code=$?
          if [ "$code" -ne 0 ]; then
            status=$code
          fi
        done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -print0)
        exit $status
    - name: Report link check results
      if: steps.link-check.outcome == 'failure'
      run: |
        echo "::warning::Some markdown links are broken. Please review the link check results above."

  spell-check:
    name: Spell check
    runs-on: ubuntu-latest
    # Checks spelling in markdown files
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'

    - name: Install cSpell
      run: npm install -g cspell

    - name: Run cSpell
      continue-on-error: false
      id: spell-check
      run: cspell "**/*.md" --no-progress --no-summary

    - name: Report spell check results
      if: steps.spell-check.outcome == 'failure'
      run: |
        echo "::warning::Spelling issues found. Please review the spell check results above and consider fixing typos or adding legitimate words to cspell.json."